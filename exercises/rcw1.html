        <style>
:root{--navy:#3C518A;--ink:#1F2A4D;--gold:#D9AE4A;--paper:#fff;--card:#F5F6FA;--line:#DCE1EB;--muted:#5A6378;--field:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#131A2E;--card:#1B2440;--ink:#F2F4FA;--line:#33406A;--muted:#AEB7D1;--field:#131A2E}}
.staticrypt-html,.staticrypt-body{height:100%;margin:0}
.staticrypt-content{min-height:100%;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.staticrypt-page{width:100%;max-width:400px;padding:0;margin:0}
.staticrypt-form{background:var(--card);border:0;border-radius:24px;overflow:hidden;padding:0;margin:0;max-width:none;text-align:left;box-shadow:0 10px 30px rgba(31,42,77,.14)}
.brand-hero{background:var(--navy);padding:18px;position:relative;overflow:hidden}
.brand-hero::before{content:"";position:absolute;right:-120px;top:-140px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(217,174,74,.3),rgba(217,174,74,0) 65%)}
.brand-hero{display:grid;grid-template-columns:minmax(0,128px) minmax(0,1fr);gap:16px;align-items:center;padding:16px}.brand-hero img{position:relative;display:block;width:100%;height:auto;border-radius:0;box-shadow:none}.brand-hero .staticrypt-instructions{position:relative;margin:0}.brand-hero .staticrypt-title{color:#fff;font-size:20px;line-height:1.2;margin:0 0 8px;text-wrap:balance;max-width:12em}.brand-hero .staticrypt-instructions p+p{color:#DFE4F4;font-size:13.5px;font-weight:500}@media (max-width:360px){.brand-hero{grid-template-columns:minmax(0,96px) minmax(0,1fr);gap:12px}.brand-hero .staticrypt-title{font-size:18px}}
.brand-body{padding:20px 18px 22px}
.staticrypt-title{font-family:"Montserrat",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;font-size:24px;line-height:1.15;margin:0 0 6px;color:var(--ink)}
.staticrypt-instructions p{margin:0}
.staticrypt-instructions p+p{color:var(--muted);font-size:15px;line-height:1.4}
.staticrypt-instructions{margin:0 0 18px}
.staticrypt-hr{display:none}
.staticrypt-password-container{position:relative;background:var(--field);border:1.5px solid var(--line);border-radius:10px;margin:0 0 14px;width:100%;box-sizing:border-box}
.staticrypt-password-container:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,174,74,.3)}
.staticrypt-form input[type="password"],.staticrypt-form input[type="text"]{background:transparent;color:var(--ink);border:0;outline:0;box-sizing:border-box;width:100%;font-size:16px;padding:14px 44px 14px 14px}
.staticrypt-toggle-password-visibility{cursor:pointer;height:20px;width:20px;padding:13px;opacity:.6;position:absolute;right:0;top:50%;transform:translateY(-50%)}
@media (prefers-color-scheme:dark){.staticrypt-toggle-password-visibility{filter:invert(1)}}
label.staticrypt-remember{display:flex;align-items:center;margin-bottom:14px}
.staticrypt-remember input[type=checkbox]{transform:scale(1.4);margin-right:12px}
.staticrypt-form .staticrypt-decrypt-button{width:100%;border:0;border-radius:999px;padding:15px;background:var(--gold);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif;font-size:15px;font-weight:700;cursor:pointer;text-transform:none;letter-spacing:.01em}
.staticrypt-form .staticrypt-decrypt-button:hover,.staticrypt-form .staticrypt-decrypt-button:active,.staticrypt-form .staticrypt-decrypt-button:focus{background:var(--gold);filter:brightness(94%)}
.hidden{display:none !important}
.staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center}
.staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid var(--navy);border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
@keyframes spinner-border{100%{transform:rotate(360deg)}}

.brand-hero img{animation:rise .7s cubic-bezier(.2,.8,.2,1) both .1s}
.brand-hero .staticrypt-instructions{animation:rise .7s cubic-bezier(.2,.8,.2,1) both .22s}
.staticrypt-form{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.brand-body{animation:rise .7s cubic-bezier(.2,.8,.2,1) both .34s}
.brand-hero::before{animation:drift 9s ease-in-out infinite alternate}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-50px,40px)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.staticrypt-form.shake{animation:shake .5s both}
.staticrypt-error{margin:-4px 0 14px;padding:10px 12px;border-radius:10px;background:#FBE8E3;color:#B23B25;font-size:13.5px;font-weight:600;line-height:1.35}
@media (prefers-color-scheme:dark){.staticrypt-error{background:#3A1F1A;color:#F3A593}}
.staticrypt-form .staticrypt-decrypt-button{transition:transform .08s ease,filter .15s}
.staticrypt-form .staticrypt-decrypt-button:active{transform:scale(.97)}
.staticrypt-form .staticrypt-decrypt-button:disabled{opacity:.75;cursor:progress}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.staticrypt-form input{font-family:inherit}</style>
