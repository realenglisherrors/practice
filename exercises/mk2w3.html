<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F8; --card:#FFFFFF; --ink:#17203A; --muted:#5A6378; --line:#DCE1EB;
  --accent:#2450B8; --accent-soft:#E5ECFA; --on-accent:#FFFFFF;
  --mark:#FFE36E; --good:#1A7A4B; --good-soft:#E2F3E9; --bad:#B23B25; --bad-soft:#FBE8E3;
  --wa:#1C9E50;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141D; --card:#1A1F2D; --ink:#E7EAF2; --muted:#9BA4B9; --line:#2B3246;
    --accent:#86A7FF; --accent-soft:#223056; --on-accent:#0E1530;
    --mark:rgba(255,222,90,.32); --good:#5ACB92; --good-soft:#15322A; --bad:#F2896F; --bad-soft:#3A1E1A;
    --wa:#25B862;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141D; --card:#1A1F2D; --ink:#E7EAF2; --muted:#9BA4B9; --line:#2B3246;
  --accent:#86A7FF; --accent-soft:#223056; --on-accent:#0E1530;
  --mark:rgba(255,222,90,.32); --good:#5ACB92; --good-soft:#15322A; --bad:#F2896F; --bad-soft:#3A1E1A;
  --wa:#25B862;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.55;
}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-inner{max-width:640px;margin:0 auto;padding:10px 18px 12px}
.top-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.jump{flex:1;min-width:0;position:relative}
.jump select{
  width:100%;appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--ink);
  font:inherit;font-weight:700;font-size:16px;padding:4px 26px 4px 0;text-overflow:ellipsis;
}
.jump::after{content:"";position:absolute;right:6px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pct{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.saved{font-size:13px;color:var(--good);opacity:0;transition:opacity .25s}
.saved.show{opacity:1}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}

/* Layout */
main{max-width:640px;margin:0 auto;padding:24px 18px 130px}
.page{display:none}
.page.on{display:block}
h1{font-size:29px;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin:0 0 8px}
h2{font-size:20px;line-height:1.25;font-weight:800;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}

/* Lessons */
.term{font-size:23px;margin:0 0 4px;color:var(--accent)}
/*brand*/
:root{--paper:#F3F5FA;--ink:#1F2A4D;--muted:#5B6687;--line:#DADEE9;--accent:#3C518A;--accent-soft:#E6EAF4;--on-accent:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#131A2E;--card:#1D2746;--ink:#E8ECF7;--muted:#9AA5C6;--line:#2E3A60;--accent:#A9B8E6;--accent-soft:#26325A;--on-accent:#131A2E}}
:root[data-theme="dark"]{--paper:#131A2E;--card:#1D2746;--ink:#E8ECF7;--muted:#9AA5C6;--line:#2E3A60;--accent:#A9B8E6;--accent-soft:#26325A;--on-accent:#131A2E}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,.term,.grp-term{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
h1{font-size:30px}
.grp-eye,.pc-eye,.pp-h,.sum-eye{font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:700;letter-spacing:.14em}
.grp-eye{color:var(--pc-goldtxt)}
.due{display:inline-block;margin:2px 0 10px;padding:5px 12px;border-radius:99px;background:var(--pc-goldbg);color:var(--pc-goldtxt);font-weight:800;font-size:15px}
.lede{color:var(--ink)!important;font-weight:700;font-size:17px;line-height:1.45;margin:0 0 22px;max-width:34em}
.lede::before{content:"HOW TO DO THIS PAGE";display:block;font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--pc-goldtxt);margin-bottom:4px}
.rate-wrap{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.rate-q{margin:0 0 8px;font-weight:700;font-size:15px}
.grp-tick .rate-wrap{border-top:0;margin-top:0;padding-top:0}
.ex b.pw{color:var(--pron);font-weight:800;font-style:normal;background:var(--pron-soft);border-radius:4px;padding:0 3px}
.use{display:block;margin-top:6px;font-weight:500;color:var(--pc-goldtxt,#A8841F)}
.use b{font-weight:800}
#meter{background:none!important;height:7px!important;overflow:visible!important}
#bar{display:none!important}
.meter .segs{display:flex!important;gap:4px;height:100%;width:100%!important;background:none!important;border-radius:0}
.segs i{flex:1;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.segs i b{display:block;height:100%;width:0;background:var(--pc-navy,#3E4C84);opacity:.45;border-radius:99px;transition:width .3s}
.segs i.cur{box-shadow:0 0 0 1.5px var(--pc-gold,#C9A13B)}
.segs i.full b{opacity:1}
.pct{white-space:nowrap;font-variant-numeric:tabular-nums}
.sum-eye{margin:0 0 4px;font-size:12.5px;font-weight:800;letter-spacing:.12em;color:var(--pc-goldtxt,#A8841F)}
.sum{display:grid;gap:8px}
.sum-row{display:flex;align-items:baseline;gap:12px;font-size:15.5px;color:var(--muted)}
.sum-n{min-width:3.4em;font-size:24px;font-weight:700;color:var(--pc-navy,#3E4C84);font-variant-numeric:tabular-nums}
.cf-box{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.cf-box i{position:absolute;top:-20px;border-radius:2px;animation:cf-fall linear forwards}
@keyframes cf-fall{to{top:105%;transform:translateX(40px) rotate(540deg)}}
:root{--pron:#A44879;--pron-soft:#F6E6EF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pron:#E08BB8;--pron-soft:#3A2232}}
:root[data-theme="dark"]{--pron:#E08BB8;--pron-soft:#3A2232}
.card .pron,.pron{color:var(--pron)!important;background:var(--pron-soft)!important}
.grp-eye{margin:0 0 2px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grp-item{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.grp-term{font-size:20px;margin:0 0 6px;color:var(--accent)}
.grp-item .pron{font-size:17px}
.grp-tick{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
:root{--pc-navy:#3E4C84;--pc-light:#DCE0EE;--pc-gold:#C9A13B;--pc-goldtxt:#A8841F;--pc-goldbg:#FBF4E2;--pc-goldtrack:#EFE3C2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--pc-navy:#8C9BE0;--pc-light:#2E3550;--pc-gold:#E2BC5A;--pc-goldtxt:#E2BC5A;--pc-goldbg:#3A3320;--pc-goldtrack:#4D4430}}
:root[data-theme="dark"]{--pc-navy:#8C9BE0;--pc-light:#2E3550;--pc-gold:#E2BC5A;--pc-goldtxt:#E2BC5A;--pc-goldbg:#3A3320;--pc-goldtrack:#4D4430}
.pc-eye{margin:0 0 6px;font-size:12.5px;font-weight:800;letter-spacing:.12em;color:var(--pc-navy)}
.pc-h{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:27px;line-height:1.15;color:var(--pc-navy);margin:0 0 8px;letter-spacing:-.01em}
.pc-num{color:var(--pc-gold)}
.pc-sub{margin:0 0 12px;color:var(--muted);font-size:15.5px}
.pc-svg{display:block;width:100%;height:auto;overflow:visible}
.pc-grid{stroke:var(--line);stroke-width:.6}
.pc-ax{font-size:11px;fill:var(--muted)}
.pc-cur{font-weight:800;fill:var(--pc-navy)}
.pc-ghost{fill:none;stroke:var(--line);stroke-width:.8;stroke-dasharray:2.5 2.5}
.pc-prac{fill:var(--pc-light);background:var(--pc-light)}
.pc-mast{fill:var(--pc-navy);background:var(--pc-navy)}
.pc-lbl{font-size:11.5px;font-weight:700;fill:var(--pc-navy)}
.pc-lblw{fill:var(--card)}
.pc-tot{fill:none;stroke:var(--pc-navy);stroke-width:1.3;stroke-dasharray:4 3;opacity:.75}
.pc-gold{fill:none;stroke:var(--pc-gold);stroke-width:1.8}
.pc-totd{fill:var(--card);stroke:var(--pc-navy);stroke-width:1}
.pc-goldd{fill:var(--pc-gold)}
.pc-sw{display:inline-block;flex:none;width:13px;height:13px;border-radius:3px}
.pc-leg2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.pc-leg2 span{display:flex;align-items:center;gap:8px;min-width:0}
.pc-ln{display:inline-block;flex:none;width:18px;height:0}
.pc-ln-tot{border-top:2px dashed var(--pc-navy)}
@media (max-width:360px){.pc-leg2{grid-template-columns:1fr}}
.pp-card{margin-top:16px;background:var(--pc-goldbg);border-radius:12px;padding:14px 14px 12px}
.pp-h{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pc-goldtxt)}
.pp-sub{margin:2px 0 10px;font-size:13.5px;color:var(--muted)}
.pp-row{display:grid;grid-template-columns:4.6em 1fr 4.2em;align-items:center;gap:10px;padding:5px 0;font-size:14.5px;color:var(--muted)}
.pp-bar{display:block;height:8px;border-radius:99px;background:var(--pc-goldtrack);overflow:hidden}
.pp-bar i{display:block;height:100%;border-radius:99px;background:var(--pc-gold)}
.pp-n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--pc-navy)}
.pp-last{font-weight:700;color:var(--pc-navy)}
.pp-last .pp-bar{height:10px}
.def{margin:0 0 12px}
.ex{margin:0 0 16px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);font-style:italic}
.task{border-top:1px dashed var(--line);padding-top:14px}
.task-prompt{font-weight:700;font-size:15.5px;margin:0 0 8px}
.sub{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 5px}
textarea{
  display:block;width:100%;font:inherit;font-size:17px;line-height:1.45;color:var(--ink);
  background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;
  resize:none;min-height:74px;overflow:hidden;
}
textarea::placeholder{color:var(--muted);opacity:.7}
textarea:focus,input.blank:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* The correction mark: the error crossed out, the fix written in */
.edit{margin:0 0 12px}
.edit .was{display:block;color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;font-size:16px;margin-bottom:2px}
.edit .now{display:block;color:var(--accent);font-size:22px;font-weight:800;line-height:1.25}
.pron{display:inline-block;font-weight:800;font-size:20px;letter-spacing:.05em;background:var(--accent-soft);color:var(--accent);padding:2px 12px;border-radius:8px;margin:0 0 12px}

.tick{display:flex;align-items:center;gap:12px;margin-top:12px;font-weight:600;font-size:15.5px}
.tick input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* Exercises */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.bank span{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px;padding:6px 12px;border-radius:99px}
ol.qs{list-style:none;margin:0;padding:0;counter-reset:q}
.q{counter-increment:q;position:relative;padding:14px 0 14px 34px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:4px}
.q::before{content:counter(q);position:absolute;left:0;top:14px;width:24px;height:24px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:13px;font-weight:700;display:grid;place-items:center;color:var(--muted)}
.q:first-child::before{top:4px}
.q.ok::before{background:var(--good);border-color:var(--good);color:var(--card)}
.q.no::before{background:var(--bad);border-color:var(--bad);color:var(--card)}
.sent{margin:0;line-height:2}
input.blank{
  font:inherit;font-size:17px;color:var(--ink);background:var(--paper);
  border:0;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;
  padding:1px 6px;width:9ch;max-width:100%;line-height:1.5;
}
input.blank.ok,textarea.ok{border-color:var(--good);background:var(--good-soft)}
input.blank.no,textarea.no{border-color:var(--bad);background:var(--bad-soft)}
.orig{margin:0 0 6px;font-size:14px;color:var(--muted)}
.fb{font-size:14.5px;margin-top:6px;min-height:0}
.fb:empty{display:none}
.fb.ok{color:var(--good);font-weight:600}
.fb.no{color:var(--bad)}
.fb .ans{color:var(--ink);font-weight:700}
.linkbtn{background:none;border:0;padding:0 0 0 6px;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14.5px}
.slot{display:inline-block;min-width:5.5ch;text-align:center;border-bottom:2px solid var(--muted);color:var(--muted);line-height:1.3;padding:0 4px}
.slot.filled{color:var(--accent);border-color:var(--accent);font-weight:700}
.seg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:8px}
.seg-label{font-size:13px;color:var(--muted);font-weight:600;min-width:52px}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border:1.5px solid var(--line);border-radius:22px;background:var(--paper)}
.seg button{border:0;background:transparent;color:var(--ink);font-size:15.5px;padding:7px 16px;border-radius:99px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.checkbar{margin-top:18px}
.score{margin:10px 0 0;font-weight:600;text-align:center}
.score:empty{display:none}

/* Reading */
.reading p{font-size:18px;line-height:1.75;margin:0 0 16px}
.reading p:last-child{margin:0}
.reading strong{background:linear-gradient(transparent 60%,var(--mark) 60%);padding:0 1px;font-weight:800}

/* Mini-lessons */
.rule{padding:14px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0;padding-top:0}
.rule h3{margin:0 0 2px;font-size:17px}
.formula{display:block;color:var(--accent);font-weight:700;margin:0 0 4px}
.rule p{margin:0 0 6px}
.rule .ex{margin:6px 0 0}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:15.5px}
.tbl-wrap{overflow-x:auto;margin:6px 0 14px}
table{border-collapse:collapse;min-width:100%;font-size:16px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13.5px;color:var(--muted);font-weight:700}

/* Intro */
.date{color:var(--muted);font-weight:600;margin:0 0 6px}
.brand-logo{display:block;width:140px;max-width:45%;height:auto;margin:0 0 18px;border-radius:4px}
.brand{font-weight:800;color:var(--accent);font-size:15px;margin:0 0 18px}
.streak{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.streak .big{font-size:46px;font-weight:800;line-height:1;color:var(--good)}
.streak .what{color:var(--muted)}
.nice{display:inline-block;margin-top:10px;font-weight:800;font-size:20px;color:var(--accent);transform:rotate(-2deg)}
.how{margin:0;padding-left:20px}
.how li{margin-bottom:6px}

/* Send */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-weight:700;font-size:17px;padding:13px 18px;min-height:52px;border-radius:14px;
  border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);text-decoration:none;
}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn + .btn{margin-top:10px}
.step{display:flex;gap:12px;align-items:baseline;margin-bottom:6px}
.step b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:14px}
.card p.small{font-size:15px;color:var(--muted);margin:0 0 14px}
.missing{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.missing button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:14.5px}
details summary{cursor:pointer;font-weight:700;color:var(--accent)}
textarea.preview{margin-top:10px;font-size:14px;min-height:240px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
.fine{font-size:14px;color:var(--muted);text-align:center;margin:18px 0 0}
.fine button{background:none;border:0;color:var(--bad);text-decoration:underline;font-size:14px;padding:4px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-inner{max-width:640px;margin:0 auto;display:flex;gap:10px}
.nav button{flex:1;min-height:50px;border-radius:14px;font-weight:700;font-size:17px;border:1.5px solid var(--accent)}
#back{background:transparent;color:var(--accent);flex:0 0 34%}
#next{background:var(--accent);color:var(--on-accent)}
.nav button:disabled{opacity:.35}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;transition:all .25s;z-index:30;max-width:calc(100% - 36px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/*brand2*/
:root{--paper:#FFFFFF}
.def{margin:6px 0 14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.dlab{display:block;margin:0 0 4px;font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pc-goldtxt)}
.dl{display:block;padding:4px 0;line-height:1.45}
.dl+.dl{border-top:1px solid var(--line)}
.def b{color:var(--accent)}
.edit .now{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
.card{border-radius:12px;border:1px solid var(--line);box-shadow:none}
.ex{font-style:normal;border-left-color:var(--accent)}
.ex b{color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:8px;padding:0;border:0;border-radius:0;background:none}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:15.5px;padding:8px 14px;border-radius:8px;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

or=\"middle\">5<\/text><text x=\"312.3\" y=\"221\" class=\"pc-ax\" text-anchor=\"middle\">6<\/text><rect x=\"40.7\" y=\"152.1\" width=\"30.0\" height=\"53.9\" class=\"pc-prac\"/><text x=\"55.7\" y=\"182.6\" class=\"pc-lbl\" text-anchor=\"middle\">22<\/text><rect x=\"92.0\" y=\"86.0\" width=\"30.0\" height=\"120.0\" class=\"pc-prac\"/><rect x=\"92.0\" y=\"159.4\" width=\"30.0\" height=\"46.6\" class=\"pc-mast\"/><text x=\"107.0\" y=\"126.2\" class=\"pc-lbl\" text-anchor=\"middle\">30<\/text><text x=\"107.0\" y=\"201\" class=\"pc-lbl pc-lblw\" text-anchor=\"middle\">19<\/text><rect x=\"143.3\" y=\"46.8\" width=\"30.0\" height=\"159.2\" class=\"pc-prac\"/><rect x=\"143.3\" y=\"88.4\" width=\"30.0\" height=\"117.6\" class=\"pc-mast\"/><text x=\"158.3\" y=\"71.1\" class=\"pc-lbl\" text-anchor=\"middle\">17<\/text><text x=\"158.3\" y=\"201\" class=\"pc-lbl pc-lblw\" text-anchor=\"middle\">48<\/text><polyline points=\"55.7,152.1 107.0,86.0 158.3,46.8\" class=\"pc-tot\"/><polyline points=\"55.7,206.0 107.0,159.4 158.3,88.4\" class=\"pc-gold\"/><circle cx=\"55.7\" cy=\"152.1\" r=\"2.4\" class=\"pc-totd\"/><circle cx=\"55.7\" cy=\"206.0\" r=\"2.4\" class=\"pc-goldd\"/><circle cx=\"107.0\" cy=\"86.0\" r=\"2.4\" class=\"pc-totd\"/><circle cx=\"107.0\" cy=\"159.4\" r=\"2.4\" class=\"pc-goldd\"/><circle cx=\"158.3\" cy=\"46.8\" r=\"2.4\" class=\"pc-totd\"/><circle cx=\"158.3\" cy=\"88.4\" r=\"2.4\" class=\"pc-goldd\"/><\/svg><div class=\"pc-leg2\"><span><i class=\"pc-sw pc-mast\"><\/i>Used naturally<\/span><span><i class=\"pc-sw pc-prac\"><\/i>Practicing now<\/span><span><i class=\"pc-ln pc-ln-tot\"><\/i>Everything you've worked on (65)<\/span><\/div><div class=\"pp-card\"><p class=\"pp-h\">Production Push, class by class<\/p><p class=\"pp-sub\">How many you used naturally at the start of each class<\/p><div class=\"pp-row pp-last\"><span class=\"pp-wk\">Week 3<\/span><span class=\"pp-bar\"><i style=\"width:96.7%\"><\/i><\/span><span class=\"pp-n\">29 of 30<\/span><\/div><div class=\"pp-row\"><span class=\"pp-wk\">Week 2<\/span><span class=\"pp-bar\"><i style=\"width:95.0%\"><\/i><\/span><span class=\"pp-n\">19 of 20<\/span><\/div><\/div>"}}, "pages": [{"title": "Start", "type": "intro"}, {"title": "Vocabulary and expressions", "type": "lessons", "lede": "Read each card, then write one sentence for it using the target under the box. It turns grey once you've used it.", "blocks": [{"kind": "vocab", "term": "turn up [something]", "def": "<span class=\"dlab\">Meaning<\/span><span class=\"dl\"><b>turn up<\/b> [something]: make it stronger, louder or hotter, a little at a time (think of a dial)<\/span><span class=\"dl\">The opposite is <b>turn down<\/b> [something].<\/span>", "ex": "The room is freezing. Can you <b>turn up<\/b> the heat?", "practice": "Write one sentence about a time you were cold, or couldn't hear something, and you changed a setting.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\bturn(s|ed|ing)?\\s+(up|it\\s+up|the\\s+\\w+\\s+up)\\b\">turn up [something]<\/span><\/span>", "tasks": [{"id": "v1"}]}, {"kind": "vocab", "term": "turn on [something]", "def": "<span class=\"dlab\">Meaning<\/span><span class=\"dl\"><b>turn on<\/b> [something]: start a light or a device, on or off (think of a switch)<\/span><span class=\"dl\">The opposite is <b>turn off<\/b> [something].<\/span>", "ex": "It's dark in here. Can you <b>turn on<\/b> the light?", "practice": "Write one sentence about something you turn on first thing in the morning.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\bturn(s|ed|ing)?\\s+(on|it\\s+on|the\\s+\\w+\\s+on)\\b\">turn on [something]<\/span><\/span>", "tasks": [{"id": "v2"}]}, {"kind": "vocab", "term": "window sill", "def": "<span class=\"dlab\">Meaning<\/span><span class=\"dl\"><b>window sill<\/b>: the flat shelf at the bottom of a window<\/span>", "ex": "She keeps three small plants on the <b>window sill<\/b>.", "practice": "Write one sentence about what you keep, or what you see, on a window sill.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\bwindow\\s?sills?\\b\">window sill<\/span><\/span>", "tasks": [{"id": "v3"}]}, {"kind": "vocab", "term": "a sucker for [something]", "def": "<span class=\"dlab\">Meaning<\/span><span class=\"dl\"><b>a sucker for<\/b> [something]: a person who loves something and can't resist it (informal)<\/span>", "ex": "I know I should save money, but I'm <b>a sucker for<\/b> a good sale.", "practice": "Write one sentence about something you can't say no to.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\bsuckers?\\s+for\\b\">a sucker for [something]<\/span><\/span>", "tasks": [{"id": "v4"}]}, {"kind": "vocab", "term": "long-distance relationship(s)", "def": "<span class=\"dlab\">Meaning<\/span><span class=\"dl\"><b>a long-distance relationship<\/b>: a relationship where the two people live far apart<\/span>", "ex": "They've been in a <b>long-distance relationship<\/b> for two years, and they video call every night.", "practice": "Write one sentence about someone you know, or a couple you've seen, in a long-distance relationship.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\blong[- ]distance\\b\">long-distance relationship(s)<\/span><\/span>", "tasks": [{"id": "v5"}]}, {"kind": "vocab", "term": "MIA", "def": "<span class=\"dlab\">Meaning<\/span><span class=\"dl\"><b>MIA<\/b> (missing in action): not around, not answering messages, or not showing up (informal)<\/span>", "ex": "My roommate has been <b>MIA<\/b> all week. I haven't seen him once.", "practice": "Write one sentence about a friend, a coworker or a neighbor who went MIA.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\bMIA\\b\">MIA<\/span><\/span>", "tasks": [{"id": "v6"}]}, {"kind": "vocab", "term": "put an offer on [a property]", "def": "<span class=\"dlab\">Meaning<\/span><span class=\"dl\"><b>put an offer on<\/b> [a property]: tell the owner the price you will pay to buy a house or apartment<\/span>", "ex": "We saw the condo on Saturday and <b>put an offer on<\/b> it the same night.", "practice": "Write one sentence about a house or apartment you, or someone you know, put an offer on.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\b(put|puts|putting)\\s+an?\\s+offers?\\s+on\\b\">put an offer on [a property]<\/span><\/span>", "tasks": [{"id": "v7"}]}, {"kind": "vocab", "term": "make a down payment", "def": "<span class=\"dlab\">Meaning<\/span><span class=\"dl\"><b>make a down payment<\/b>: pay the first part of the price when you buy something big, like a house or a car<\/span>", "ex": "We're saving for two more years to <b>make a down payment<\/b> on a house.", "practice": "Write one sentence about something you would need to make a down payment on.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\bdown\\s?payments?\\b\">make a down payment<\/span><\/span>", "tasks": [{"id": "v8"}]}]}, {"title": "Grammar", "type": "lessons", "lede": "Read the correction and the rule, then write one sentence for each, using the target under the box. It turns grey once you've used it.", "blocks": [{"kind": "fix", "def": "<span class=\"dlab\">Rule<\/span><span class=\"dl\">Meaning: a long distance from a place.<\/span><span class=\"dl\">Put <b>away<\/b> right after <b>far<\/b>: <b>far away from<\/b> + [something].<\/span>", "ex": "We live <b>far away from<\/b> the city center.", "practice": "Write one sentence about a place that is far away from where you live.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\bfar\\s+away\\s+from\\b\">far away from [something]<\/span><\/span>", "tasks": [{"id": "g1"}], "was": "far from the water away", "now": "far away from [something]"}, {"kind": "fix", "def": "<span class=\"dlab\">Rule<\/span><span class=\"dl\">Meaning: you have no chance to do something.<\/span><span class=\"dl\">Make the negative with <b>don't / doesn't / didn't have<\/b>. Then add <b>the opportunity to<\/b> + [V1].<\/span>", "ex": "I <b>don't have the opportunity to<\/b> travel much for work.", "practice": "Write one sentence about something you don't have the opportunity to do right now.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\b(don't|do not|doesn't|didn't)\\s+have\\s+(the\\s+)?opportunit(y|ies)\\s+to\\b\">don't have the opportunity to [V1]<\/span><\/span>", "tasks": [{"id": "g2"}], "was": "and have not the opportunity", "now": "don't have the opportunity to [V1]"}, {"kind": "fix", "def": "<span class=\"dlab\">Rule<\/span><span class=\"dl\">Meaning: in the past, you did not own or have that thing.<\/span><span class=\"dl\">Make the past negative of <b>have<\/b> with <b>didn't have<\/b>. <b>Hadn't a<\/b> sounds old-fashioned and wrong today.<\/span>", "ex": "We <b>didn't have a<\/b> car for the first two years.", "practice": "Write one sentence about something you didn't have a few years ago.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\b(didn't|did not)\\s+have\\s+an?\\b\">[subject] didn't have a [something]<\/span><\/span>", "tasks": [{"id": "g3"}], "was": "we hadn't a [something]", "now": "[subject] didn't have a [something]"}, {"kind": "fix", "def": "<span class=\"dlab\">Rule<\/span><span class=\"dl\">Meaning: two people connect and get along easily.<\/span><span class=\"dl\">A verb takes an adverb: <b>vibe really well<\/b>. <b>Good<\/b> describes a noun: a <b>good<\/b> vibe.<\/span>", "ex": "My manager and I <b>vibe really well<\/b>.", "practice": "Write one sentence about a person you vibe really well with.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\bvibe[sd]?\\s+(really\\s+)?well\\b\">[subject] vibe really well<\/span><\/span>", "tasks": [{"id": "g4"}], "was": "vibe really good", "now": "[subject] vibe really well"}, {"kind": "fix", "def": "<span class=\"dlab\">Rule<\/span><span class=\"dl\">Meaning: keep making payments until the last one.<\/span><span class=\"dl\">Put the thing you pay right after the verb: <b>pay<\/b> + [something] + <b>until the end<\/b>.<\/span>", "ex": "She will <b>pay her car loan until the end<\/b> of next year.", "practice": "Write one sentence about something you, or someone you know, will pay until the end of a contract.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\bpa(y|ys|ying|id)\\b[^.?!]*\\buntil\\s+the\\s+end\\b\">pay [something] until the end<\/span><\/span>", "tasks": [{"id": "g5"}], "was": "pay until the end your mortgage", "now": "pay [something] until the end"}, {"kind": "vocab", "def": "<span class=\"dlab\">Rule<\/span><span class=\"dl\">Meaning: <b>also<\/b> adds one more thing.<\/span><span class=\"dl\">Before a main verb, put <b>also<\/b> in front of it: <b>[subject] also [V1]<\/b>.<\/span><span class=\"dl\">After <b>be<\/b>, put <b>also<\/b> behind it: <b>is also<\/b>, <b>are also<\/b>.<\/span>", "ex": "The bank <b>also<\/b> reviews your credit history.", "practice": "Write one sentence about what a bank, a landlord or an employer also checks or asks for.<span class=\"use\"><b>✎ Use:<\/b> <span class=\"ut\" data-m=\"\\balso\\s+(?!is\\b|are\\b|was\\b|were\\b)[a-z]+\">[subject] also [V1] [something]<\/span><\/span>", "tasks": [{"id": "g6"}], "term": "[subject] also [V1] [something]"}]}, {"title": "Mini-lesson: what the verb owns", "type": "mini", "body": "\n    <div class=\"card\">\n      <p style=\"margin:0 0 10px\">Every verb <b>owns<\/b> the words it needs to make sense. They stay right after the verb. Everything else is an <b>extra<\/b> (an adjunct): time, place, manner. Extras go after the words the verb owns.<\/p>\n      <div class=\"rule\"><h3>The basic order<\/h3><span class=\"formula\">[subject] + [verb] + [what the verb owns] + [extras]<\/span><p>Test: take the extra away. The sentence still works. Take the owned word away, and it doesn't.<\/p><p class=\"ex\">She <b>paid<\/b> <b>her car loan<\/b> <i>until the end of the year<\/i>.<\/p><p class=\"ex\" style=\"margin-bottom:0\">Owned: <b>her car loan<\/b>. Extra: <i>until the end of the year<\/i>.<\/p><\/div>\n      <div class=\"rule\"><h3>Never put an extra between a verb and what it owns<\/h3><span class=\"formula\">pay + [something] + until the end<\/span><p>The owned word stays next to its verb. The extra moves to the end.<\/p><p class=\"ex\">pay until the end your mortgage &rarr; <b>pay your mortgage until the end<\/b><\/p><\/div>\n      <div class=\"rule\"><h3>Some verbs own something, some own nothing<\/h3>\n        <div class=\"tbl-wrap\"><table>\n          <tr><th>Verb<\/th><th>Owns<\/th><th>Example<\/th><\/tr>\n          <tr><td>pay<\/td><td>[something]<\/td><td>pay <b>your mortgage<\/b> until the end<\/td><\/tr>\n          <tr><td>review<\/td><td>[something]<\/td><td>The bank reviews <b>your credit history<\/b>.<\/td><\/tr>\n          <tr><td>make<\/td><td>[something]<\/td><td>make <b>a down payment<\/b><\/td><\/tr>\n          <tr><td>arrive, live, vibe<\/td><td>nothing<\/td><td>We vibe really well. They live far away from the city.<\/td><\/tr>\n        <\/table><\/div>\n        <p>A verb that owns nothing can't take a direct object. Add a small word (<b>at<\/b>, <b>in<\/b>, <b>from<\/b>) before the place: arrive <b>at<\/b> the office, live <b>far away from<\/b> the city.<\/p><\/div>\n      <div class=\"rule\"><h3>Extras have their own order<\/h3><span class=\"formula\">[manner] &gt; [quantity] &gt; [time]<\/span><p class=\"ex\">She studies carefully, a lot, every night.<\/p><\/div>\n      <p class=\"note\"><b>Tricky point:<\/b> <b>also<\/b> is an extra too, but it goes <i>before<\/i> the main verb: The bank <b>also<\/b> reviews your credit history.<\/p>\n    <\/div>", "practice": "Write two sentences about your week. In the first, use a verb that owns something, then add a time or place extra after it. In the second, use a verb that owns nothing (arrive, live or vibe), then add an extra.", "tasks": [{"id": "m1a", "label": "Verb + owned word + extra", "mins": 2}, {"id": "m1b", "label": "Verb that owns /* ---------- state ---------- */
let S = {page:0, v:{}, first:{}, shown:{}, checked:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ try { localStorage.setItem(KEY, JSON.stringify(S)); flashSaved(); } catch(e) {} }, 300);
}
function flashSaved(){ const el=$("#saved"); el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),1200); }

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const strip = s => String(s||"").replace(/<[^>]+>/g,"");
const attr = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
const norm = s => (s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/'/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

/* ---------- item registry ---------- */
const ITEMS=[], BYID={};
function reg(it){ ITEMS.push(it); BYID[it.id]=it; }
function val(it){ const v=S.v[it.id]; if (it.type==="tick") return !!v; if (v!==undefined) return v; return it.type==="fixit" ? it.orig : ""; }
function answered(it){ const v=val(it); return it.type==="tick" ? v : String(v).trim()!==""; }
function done(it){ if(!answered(it)) return false; if(it.type==="fixit") return norm(val(it))!==norm(it.orig); return true; }
function correct(it){ const v=norm(val(it)); return it.a.some(a=>norm(a)===v); }

/* ---------- rendering ---------- */
function taskHTML(practice, tasks, pi, heading){
  let h=`<div class="task"><p class="task-prompt">${practice}</p>`;
  tasks.forEach(t=>{
    reg({id:t.id,type:"write",page:pi,label:t.label?strip(t.label):"",heading,mins:t.mins});
    if(t.label) h+=`<label class="sub" for="f-${t.id}">${t.label}</label>`;
    h+=`<textarea id="f-${t.id}" data-id="${t.id}" rows="2" placeholder="Write your sentence here" ${t.label?"":`aria-label="${attr(strip(practice))}"`}></textarea>`;
  });
  return h+"</div>";
}
function rateHTML(id,pi,heading){
  reg({id,type:"choice",page:pi,label:"How it felt",heading,a:[]});
  return `<div class="rate-wrap" data-q="${id}"><p class="rate-q">How did saying them feel?</p><div class="seg" role="group" aria-label="How did saying them feel?">`+
    ["Easy","Tricky"].map(o=>`<button type="button" data-choose="${id}" data-val="${o}" aria-pressed="false">${o}</button>`).join("")+`</div><div class="fb"></div></div>`;
}
function tickHTML(id,pi,text,heading){
  reg({id,type:"tick",page:pi,label:strip(text),heading});
  return `<label class="tick"><input type="checkbox" data-id="${id}"> ${text}</label>`;
}
function checkBar(pi){
  return `<div class="checkbar"><button class="btn ghost" type="button" data-check="${pi}">Check answers</button><p class="score" id="score-${pi}" aria-live="polite"></p></div>`;
}
function extraTasks(p,pi){

}

  }
  else if(p.type==="mini"){
    h=`<h1>${p.title}</h1>${p.lede?`<p class="lede">${p.lede}</p>`:""}${p.body||""}${extraTasks(p,pi)}`;
  }
  else if(p.type==="send"){
    h=`<h1>Send to ${TEACHER}</h1>
      <p class="lede">Send your answers on WhatsApp and by email, so nothing gets lost.</p>
      <div class="card" id="sumCard"></div>
      <div class="card">
        <div class="step"><b>1</b><h2>WhatsApp</h2></div>
        <p class="small">${C.whatsapp?`Copy your answers as a backup, or open WhatsApp to send them straight to ${TEACHER}.`:`Copy your answers, then paste them in your WhatsApp chat with ${TEACHER} and send.`}</p>
        <button class="btn ghost" id="copyBtn" type="button">Copy my answers</button>
        <a class="btn wa" id="waBtn" href="#" target="_blank" rel="noopener">Open WhatsApp</a>
      </div>
      <div class="card">
        <div class="step"><b>2</b><h2>Email</h2></div>
        <p class="small">This opens your email app with everything filled in. Just tap Send.</p>
        <a class="btn" id="mailBtn" href="#" target="_blank" rel="noopener">Email my answers</a>
      </div>
      <div class="card">
        <details id="prevBox"><summary>See what ${TEACHER} will get</summary><textarea class="preview" id="preview" readonly></textarea></details>
      </div>
      <p class="fine">Your answers are saved on this phone only.<br><button type="button" id="reset">Start over</button></p>`;
  }
  return `<div class="page" data-page="${pi}">${h}</div>`;
}

$("#main").innerHTML = PAGES.map(renderPage).join("");
$("#jump").innerHTML = PAGES.map((p,i)=>`<option value="${i}">${i+1}. ${strip(p.title)}</option>`).join("");

/* ---------- restore ---------- */
function autogrow(t){ if(!t.offsetParent) return; t.style.height="auto"; t.style.height=(t.scrollHeight+3)+"px"; }
function sizeBlank(el){ el.style.width=Math.min(Math.max(9,el.value.length+2),30)+"ch"; }
function paintChoice(id){
  const v=S.v[id];
  $$(`[data-choose="${id}"]`).forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.val===v)));
  const slot=$(`[data-slot="${id}"]`); if(slot){ slot.textContent=v||"_____"; slot.classList.toggle("filled",!!v); }
}
function restoreAll(){
  $$("[data-id]").forEach(el=>{
    const it=BYID[el.dataset.id];
    if(el.type==="checkbox") el.checked=!!S.v[it.id]; else el.value=val(it);
    if(el.classList.contains("blank")) sizeBlank(el);
  });
  ITEMS.filter(i=>i.type==="choice").forEach(i=>paintChoice(i.id));
  $$("[data-q]").forEach(paintStatus);
}

/* ---------- checking ---------- */
function paintStatus(li){
  const items=li.dataset.q.split(" ").map(id=>BYID[id]);
  const fb=$(".fb",li);
  li.classList.remove("ok","no");
  items.forEach(it=>{ const el=$(`[data-id="${it.id}"]`,li); if(el) el.classList.remove("ok","no"); });
  if(!items.some(it=>S.checked[it.id])){ fb.className="fb"; fb.innerHTML=""; return; }
  const wrong=items.filter(it=>!correct(it));
  items.forEach(it=>{ const el=$(`[data-id="${it.id}"]`,li); if(el) el.classList.add(correct(it)?"ok":"no"); });
  if(!wrong.length){ li.classList.add("ok"); fb.className="fb ok"; fb.textContent="Correct."; return; }
  li.classList.add("no"); fb.className="fb no";
  if(wrong.every(it=>S.shown[it.id])) fb.innerHTML=`Answer: <span class="ans">${wrong.map(it=>it.a[0]).join(" / ")}</span>`;
  else fb.innerHTML=`Not quite. Try again.<button class="linkbtn" type="button" data-reveal="${wrong.map(w=>w.id).join(" ")}">Show answer</button>`;
}
function runCheck(pi){
  const items=ITEMS.filter(it=>it.page===pi && it.check);
  let right=0, empty=0;
  items.forEach(it=>{
    if(!answered(it) || (it.type==="fixit" && !done(it) && !S.v[it.id])){ empty++; return; }
    const ok=correct(it);
    if(S.first[it.id]===undefined) S.first[it.id]=ok;
    S.checked[it.id]=true;
    if(ok) right++;
  });
  $$(`.page[data-page="${pi}"] [data-q]`).forEach(paintStatus);
  const wrong=items.length-right-empty;
  let msg=`${right} of ${items.length} right.`;
  if(right===items.length) msg+=" Excellent!";
  else { if(wrong) msg+=" Fix the red ones and check again."; if(empty) msg+=` ${empty} still empty.`; }
  $(`#score-${pi}`).textContent=msg;
  save();
}

/* ---------- events ---------- */
$("#main").addEventListener("input",e=>{
  const el=e.target, id=el.dataset.id; if(!id) return;
  const it=BYID[id];
  S.v[id]= el.type==="checkbox" ? el.checked : el.value;
  if(it.check && S.checked[id]){ S.checked[id]=false; paintStatus(el.closest("[data-q]")); }
  if(el.tagName==="TEXTAREA") autogrow(el);
  if(el.classList.contains("blank")) sizeBlank(el);
  save(); updateProgress();
});
$("#main").addEventListener("change",e=>{ if(e.target.type==="checkbox"){ S.v[e.target.dataset.id]=e.target.checked; save(); updateProgress(); } });
$("#main").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.classList.contains("blank")){
    e.preventDefault();
    const all=$$(".blank",e.target.closest(".page")), i=all.indexOf(e.target);
    if(all[i+1]) all[i+1].focus(); else e.target.blur();
  }
});
$("#main").addEventListener("click",e=>{
  const c=e.target.closest("[data-choose]");
  if(c){
    const id=c.dataset.choose; S.v[id]=c.dataset.val;
    if(S.checked[id]) S.checked[id]=false;
    paintChoice(id); paintStatus(c.closest("[data-q]")); save(); updateProgress(); return;
  }
  const chk=e.target.closest("[data-check]");
  if(chk){ runCheck(+chk.dataset.check); return; }
  const rv=e.target.closest("[data-reveal]");
  if(rv){ rv.dataset.reveal.split(" ").forEach(id=>S.shown[id]=true); paintStatus(rv.closest("[data-q]")); save(); return; }
  const jm=e.target.closest("[data-goto]");
  if(jm){ show(+jm.dataset.goto); return; }
});

/* ---------- progress & navigation ---------- */
function updateProgress(){
  const n=ITEMS.filter(done).length, pct=ITEMS.length?Math.round(n/ITEMS.length*100):0;
  $("#bar").style.width=pct+"%"; $("#pct").textContent=pct+"%"; calm();
  $("#meter").setAttribute("aria-valuenow",pct);
  $$("#jump option").forEach((o,i)=>{
    const its=ITEMS.filter(it=>it.page===i);
    o.textContent=`${i+1}. ${strip(PAGES[i].title)}${its.length && its.every(done)?"  ✓":""}`;
  });
}
function show(i){
  i=Math.max(0,Math.min(PAGES.length-1,i));
  S.page=i;
  $$(".page").forEach(p=>p.classList.toggle("on",+p.dataset.page===i));
  $("#jump").value=i;
  $("#back").disabled=i===0;
  const last=i===PAGES.length-1;
  $("#next").style.display=last?"none":"";
  $("#back").style.flex=last?"1":"";
  $("#next").textContent= i===0 ? "Start" : (i===PAGES.length-2 ? "Review and send" : "Next");
  window.scrollTo(0,0);
  $$(`.page[data-page="${i}"] textarea`).forEach(autogrow);
  if(PAGES[i].type==="send") buildSend();
  calm();
  save();
}
$("#back").onclick=()=>show(S.page-1);
$("#next").onclick=()=>show(S.page+1);
$("#jump").onchange=e=>show(+e.target.value);

/* ---------- report ---------- */
function mark(it){
  if(!answered(it) || (it.type==="fixit" && !done(it))) return "(no answer)";
  let m;
  if(correct(it)) m = S.first[it.id]===false ? "✓ (fixed after checking)" : "✓";
  else m = `✗ (answer: ${it.a[0]})`;
  if(S.shown[it.id]) m+=" (looked at the answer)";
  return m;
}
function scoreLine(pi){
  const its=ITEMS.filter(it=>it.page===pi && it.check);
  const right=its.filter(it=>done(it)&&correct(it)).length;
  const first=its.filter(it=>S.first[it.id]===true).length;
  return `Score: ${right}/${its.length} correct (${first} right on the first try)`;
}
function writeLines(L, its){
  let last;
  its.forEach(it=>{
    if(it.heading && it.heading!==last){ L.push("", strip(it.heading)); last=it.heading; }
    if(it.type==="tick") L.push(`- ${it.label}: ${val(it)?"yes":"no"}`);
    else L.push(`- ${it.label?it.label+": ":""}${val(it).trim()||"(no answer)"}`);
  });
}
function buildReport(){
  const L=[];
  const n=ITEMS.filter(done).length;
  L.push(`${(C.brand||"Real English Errors").toUpperCase()}: WEEK ${C.week} HOMEWORK (${C.date})`);
  L.push(`Student: ${C.student}`);
  L.push("Sent: "+new Date().toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"}));
  L.push(`Completed: ${n} of ${ITEMS.length} (${Math.round(n/ITEMS.length*100)}%)`);
  PAGES.forEach((p,pi)=>{
    if(p.type==="intro"||p.type==="send") return;
    L.push("", "=== "+strip(p.title).toUpperCase()+" ===");
    const its=ITEMS.filter(it=>it.page===pi);
    const rest=its.filter(it=>!it.check && !(p.type==="lessons"));
    if(p.type==="lessons"){ writeLines(L, its); return; }
    if(p.type==="fill"||p.type==="choose"){
      L.push(scoreLine(pi));
      p.items.forEach((q,k)=>{
        const ids=(q.blanks||q.slots).map(b=>b.id);
        let s=strip(q.s); ids.forEach((id,j)=>{ s=s.replace(`{${j}}`,`[${String(S.v[id]||"").trim()||"____"}]`); });
        if(!/\[/.test(s) && ids.length) s+=` [${String(S.v[ids[0]]||"").trim()||"____"}]`;
        L.push(`${k+1}. ${s} ${ids.map(id=>mark(BYID[id])).join(" | ")}`);
      });
    } else if(p.type==="fixit"){
      L.push(scoreLine(pi));
      its.filter(it=>it.check).forEach((it,k)=>L.push(`${k+1}. ${done(it)?val(it).trim():strip(it.orig)} ${mark(it)}`));
    }
    if(rest.length) writeLines(L, rest);
  });
  return L.join("\n");
}

/* ---------- send page ---------- */
function buildSend(){
  const n=ITEMS.filter(done).length, total=ITEMS.length;
  const missing=PAGES.map((p,i)=>({i,t:strip(p.title),left:ITEMS.filter(it=>it.page===i&&!done(it)).length})).filter(x=>x.left);
  $("#sumCard").innerHTML = missing.length
    ? `<h2>You finished ${n} of ${total}.</h2><p class="small" style="margin:0">You can send now, or finish these first:</p>
       <div class="missing">${missing.map(m=>`<button type="button" data-goto="${m.i}">${m.t} (${m.left} left)</button>`).join("")}</div>`
    : `<p class="sum-eye">WEEK ${C.week} COMPLETE</p><h2 style="margin:0 0 12px">Well done, ${C.student}.</h2>${summary()}<p class="small" style="margin:12px 0 0">Send your answers to ${TEACHER} below.</p>`;
  if(!missing.length && !S.fin){ S.fin=1; save(); setTimeout(confetti,250); }
  const body=buildReport();
  $("#preview").value=body;
  $("#mailBtn").href=`mailto:${EMAIL}?subject=${encodeURIComponent(`${C.student}: Week ${C.week} homework`)}&body=${encodeURIComponent(body.replace(/\n/g,"\r\n"))}`;
  $("#waBtn").href=`https://wa.me/${C.whatsapp?String(C.whatsapp).replace(/\D/g,""):""}?text=${encodeURIComponent(body)}`;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{
    const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,text.length);
    const ok=document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600); }
$("#copyBtn").onclick=async()=>{
  buildSend();
  const ok=await copyText($("#preview").value);
  if(ok){ $("#copyBtn").textContent="Copied ✓"; toast(`Copied. Now paste it in WhatsApp and send it to ${TEACHER}.`); setTimeout(()=>$("#copyBtn").textContent="Copy my answers",2500); }
  else { $("#prevBox").open=true; const p=$("#preview"); p.focus(); p.select(); toast("Press and hold the text to copy it."); }
};
$("#mailBtn").addEventListener("click",()=>{ buildSend(); setTimeout(()=>toast("Email ready. Just tap Send."),600); });
$("#waBtn").addEventListener("click",()=>buildSend());
$("#prevBox").addEventListener("toggle",()=>{ if($("#prevBox").open) buildSend(); });
$("#reset").onclick=()=>{
  if(!confirm("Erase all your answers and start again?")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S={page:0,v:{},first:{},shown:{},checked:{}};
  restoreAll(); $$(".score").forEach(s=>s.textContent="");
  updateProgress(); show(0);
};

restoreAll();
updateProgress();
show(S.page||0);

/* ---------- section bar, time left, finish screen ---------- */
function secs(){ return PAGES.map((p,i)=>({i,its:ITEMS.filter(it=>it.page===i)})).filter(x=>x.its.length); }
function mins(it){ return it.type==="write"?(it.mins||1) : it.type==="tick"?(PAGES[it.page].type==="reading"?3:0.3) : 0.35; }
function calm(){
  const ss=secs(), box=$("#segs"); if(!box) return;
  if(box.children.length!==ss.length) box.innerHTML=ss.map(()=>'<i><b></b></i>').join("");
  ss.forEach((x,k)=>{ const f=x.its.filter(done).length/x.its.length, el=box.children[k];
    el.firstChild.style.width=(f*100)+"%"; el.classList.toggle("full",f===1); el.classList.toggle("cur",x.i===S.page); });
  const left=ss.filter(x=>!x.its.every(done)).length;
  const m=Math.ceil(ITEMS.filter(it=>!done(it)).reduce((a,it)=>a+mins(it),0));
  $("#pct").textContent= left? `${left} left · ~${Math.max(1,m)} min` : "All done ✓";
}
function summary(){
  const wrote=ITEMS.filter(it=>it.type==="write"&&done(it)).length;
  const chk=ITEMS.filter(it=>it.check), right=chk.filter(it=>done(it)&&correct(it)).length;
  const H=(C.progress&&C.progress.history)||[], n=H.length>1?H[H.length-1][1]-H[H.length-2][1]:(H.length?H[0][1]:0);
  const row=(a,t)=>`<div class="sum-row"><span class="sum-n">${a}</span><span>${t}</span></div>`;
  return `<div class="sum">${row(wrote,"sentences written")}${row(`${right}/${chk.length}`,"answers correct")}${n?row(n,"new words and structures practiced for next class"):""}</div>`;
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#3E4C84","#C9A13B","#A44879","#2E5BDB","#E2BC5A"], box=document.createElement("div"); box.className="cf-box";
  for(let k=0;k<80;k++){ const d=document.createElement("i");
    d.style.cssText=`left:${Math.random()*100}%;background:${cols[k%cols.length]};animation-delay:${Math.random()*0.4}s;animation-duration:${1.8+Math.random()*1.3}s;transform:rotate(${Math.random()*360}deg);width:${6+Math.random()*5}px;height:${8+Math.random()*7}px`;
    box.appendChild(d); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),3800);
}

/* ---------- cross off Use targets ---------- */
function useCheck(task){
  if(!task) return;
  const txt=[...task.querySelectorAll("textarea")].map(t=>t.value).join(" ").replace(/[\u2018\u2019]/g,"'");
  task.querySelectorAll(".ut[data-m]").forEach(u=>{ let ok=false; try{ ok=new RegExp(u.dataset.m,"i").test(txt); }catch(e){} u.classList.toggle("hit",ok); });
}
document.addEventListener("input",e=>{ if(e.target.matches&&e.target.matches(".task textarea")) useCheck(e.target.closest(".task")); });
setTimeout(()=>document.querySelectorAll(".task").forEach(useCheck),0);
</script>
</body>
